[package]
name = "thumbs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
ravif = { version = "0.13", default-features = false, features = ["threading"] }
rayon = "1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
debug = false
