# Build the Quartermaster Companion (companion/) for Windows and Linux. docs/releasing.md.
#
# - Manual run (any branch): a test build — tests, then the installers as
#   workflow artifacts (14 days). No release, nothing the updater can see.
# - Tag `companion-v*`: tests, then a *draft* release with the installers, the
#   updater signatures and latest.json. Nothing goes live until the draft is
#   published by hand. A plain tag (`companion-vX.Y.Z`, on main) is a full
#   release; a channel tag (`companion-vX.Y.Z-<channel>.<n>`, on
#   channel/<channel>) is drafted as a pre-release. Publishing moves the tag
#   into channels.json (release.yml).
#
# Secrets (one key for both apps): TAURI_SIGNING_PRIVATE_KEY (the minisign key,
# one line), TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the key has none).
name: Build companion

on:
  push:
    tags: ["companion-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Companion version (Cargo.toml)
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' companion/src-tauri/Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Companion version $version"
          # tauri.conf.json carries no version of its own (Tauri then takes Cargo.toml's); one that appears must agree
          conf=$(jq -r '.version // empty' companion/src-tauri/tauri.conf.json)
          if [ -n "$conf" ] && [ "$conf" != "$version" ]; then
            echo "tauri.conf.json says $conf, Cargo.toml says $version" >&2
            exit 1
          fi
      - name: Tag matches the companion version
        if: startsWith(github.ref, 'refs/tags/companion-v')
        run: |
          tag=${GITHUB_REF#refs/tags/companion-v}
          if [ "$tag" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag companion-v$tag but Cargo.toml says ${{ steps.version.outputs.version }}" >&2
            exit 1
          fi
      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (companion SPA)
        run: pnpm --filter sc-quartermaster-companion typecheck
      # The companion's own logic (pure; no database, no game data)
      - name: Node tests
        run: node --test --test-concurrency=1 "test/companion-*.test.ts"
      # Pure Rust tests only; the readers' screenshot tests are sc-ohseearr's. The OCR crates come from GitHub by tag.
      - name: Rust tests
        run: cargo test --release --manifest-path companion/src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.name }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      # The production key pair: the secrets hold its private half, and the build keeps the production public key
      # of tauri.conf.json (every other build swaps in the development one, scripts/build.mjs)
      QM_UPDATER_KEY: prod
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - name: Linux packages
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: companion/src-tauri
      - run: pnpm install --frozen-lockfile
      # Windows: DirectML.dll (GPU OCR) into the resources the setup bundles; checked against its pinned SHA-256
      - name: DirectML (Windows)
        if: matrix.name == 'windows'
        run: pnpm companion:directml
      # companion:build = build:windows (the NSIS setup) or build:linux (the AppImage); the updater artifacts (.sig)
      # come from the companion's own configuration because the signing key is in the environment.
      - name: Build
        run: pnpm companion:build
      # The bundles are named after the product ("Quartermaster Companion_<v>_…"); a release asset cannot keep the
      # space (GitHub rewrites it), so the files go into the release under "Quartermaster-Companion_<v>_…"
      # (scripts/release-lib.mjs assetNames). A signature covers the bytes, not the name.
      - name: Collect (Linux)
        if: matrix.name == 'linux'
        shell: bash
        run: |
          mkdir -p assets
          dir=companion/src-tauri/target/release/bundle/appimage
          ls -la "$dir"
          cp "$dir/Quartermaster Companion_${VERSION}_amd64.AppImage" "assets/Quartermaster-Companion_${VERSION}_amd64.AppImage"
          cp "$dir/Quartermaster Companion_${VERSION}_amd64.AppImage.sig" "assets/Quartermaster-Companion_${VERSION}_amd64.AppImage.sig"
          ls -la assets
      - name: Collect (Windows)
        if: matrix.name == 'windows'
        shell: bash
        run: |
          mkdir -p assets
          dir=companion/src-tauri/target/release/bundle/nsis
          ls -la "$dir"
          cp "$dir/Quartermaster Companion_${VERSION}_x64-setup.exe" "assets/Quartermaster-Companion_${VERSION}_x64-setup.exe"
          cp "$dir/Quartermaster Companion_${VERSION}_x64-setup.exe.sig" "assets/Quartermaster-Companion_${VERSION}_x64-setup.exe.sig"
          ls -la assets
      - uses: actions/upload-artifact@v7
        with:
          name: quartermaster-companion-${{ matrix.name }}-${{ needs.test.outputs.version }}
          path: assets/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Draft release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/companion-v')
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: quartermaster-companion-*
          path: assets
          merge-multiple: true
      - name: Draft release
        run: |
          node scripts/latest-json.mjs "$TAG" assets > assets/latest.json
          cat assets/latest.json
          case $VERSION in
          *-*) pre=--prerelease ;;
          *) pre= ;;
          esac
          # shellcheck disable=SC2086  # $pre is one flag or nothing
          gh release create "$TAG" --draft $pre --latest=false --title "Quartermaster Companion $VERSION" --notes "" assets/*
          echo "Draft release $TAG created — publish it on GitHub."
