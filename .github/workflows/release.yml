# After a release is published (a draft made public, as a pre-release or a full
# one), by the tag's prefix:
# - `app-v…` / `companion-v…`: channels.json on the `channels` branch points at
#   the tag — the product's `stable` for a plain version, its channel entry for
#   `x.y.z-<channel>.<n>` (created on the channel's first version). A tag that
#   is not newer than the one listed leaves the file alone.
# - `data-<game label>-<n>`: `data.stable` in channels.json.
# Any other tag (this repository's releases are nothing else) is skipped.
#
# `channels` is the feed branch: only CI writes it (this workflow and
# channels.yml), as the GitHub Actions bot; it is created here, as an orphan
# with the file as its only content, when it does not exist yet. For an app or
# companion tag the README's downloads block on `main` is then rewritten from
# the stable tags and pushed with the deploy key (README_DEPLOY_KEY), the only
# bypass of main's ruleset; nothing else here touches `main`. A manual run with
# a tag redoes both for a release already published. docs/releasing.md.
name: Release published

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Published release tag (app-vX.Y.Z[-<channel>.<n>], companion-vX.Y.Z[-<channel>.<n>], data-<game label>-<n>)"
        required: true
        type: string

permissions:
  contents: write

# Releases published close together, and channels.yml, must not push at the same time
concurrency:
  group: channels-json
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  channels:
    name: channels.json
    if: startsWith(github.event.release.tag_name || inputs.tag, 'app-v') || startsWith(github.event.release.tag_name || inputs.tag, 'companion-v') || startsWith(github.event.release.tag_name || inputs.tag, 'data-')
    runs-on: ubuntu-24.04
    steps:
      # The scripts always come from main (not from whatever commit the tag sits on)
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Switch to the channels branch
        run: |
          mkdir -p "$RUNNER_TEMP/qm-scripts"
          cp scripts/*.mjs "$RUNNER_TEMP/qm-scripts/"
          if git ls-remote --exit-code --heads origin channels > /dev/null; then
            git fetch --depth=1 origin channels
            git checkout -B channels FETCH_HEAD
          else
            echo "No channels branch yet: creating it as an orphan"
            git checkout --orphan channels
            git rm -rf --quiet .
          fi
          ls -la
      - name: Point channels.json at ${{ github.event.release.tag_name || inputs.tag }}
        run: node "$RUNNER_TEMP/qm-scripts/channels-set.mjs" "$TAG" channels.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add channels.json
          if git diff --cached --quiet && git rev-parse --verify --quiet HEAD > /dev/null; then
            echo "channels.json already up to date"
            exit 0
          fi
          git commit -m "Point channels.json at ${TAG}"
          git push origin channels
      # The README's downloads block on main follows the stable tags (app and companion releases only). main takes no
      # direct pushes except through the deploy key, the one bypass of its ruleset (docs/releasing.md); without the
      # secret the step is skipped and says so.
      - name: README downloads block on main
        if: startsWith(env.TAG, 'app-v') || startsWith(env.TAG, 'companion-v')
        env:
          README_DEPLOY_KEY: ${{ secrets.README_DEPLOY_KEY }}
        run: |
          if [ -z "$README_DEPLOY_KEY" ]; then
            echo "::warning::README_DEPLOY_KEY is not set: the README's downloads block is not updated"
            exit 0
          fi
          cp channels.json "$RUNNER_TEMP/channels.json"
          key="$RUNNER_TEMP/readme_deploy_key"
          printf '%s\n' "$README_DEPLOY_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth=1 --branch main "git@github.com:${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/main"
          cd "$RUNNER_TEMP/main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # A pull request merged in between: rebase on it and push again (three tries)
          for try in 1 2 3; do
            node "$RUNNER_TEMP/qm-scripts/readme-downloads.mjs" "$RUNNER_TEMP/channels.json" README.md
            git add README.md
            if git diff --cached --quiet; then
              echo "README's downloads block already up to date"
              exit 0
            fi
            git commit -m "README: latest downloads for ${TAG}"
            if git push origin HEAD:main; then exit 0; fi
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
          done
          echo "::error::could not push the README to main"
          exit 1
