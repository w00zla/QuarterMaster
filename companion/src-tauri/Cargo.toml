[package]
name = "quartermaster-companion"
version = "0.2.0"
description = "Quartermaster Companion: reads Star Citizen's Game.log for the Quartermaster web app"
authors = ["w00zla"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue,
# https://github.com/rust-lang/cargo/issues/8519)
name = "companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-ico/png: without them the bundle icons are not decoded and the windows get no icon (taskbar, Alt-Tab)
tauri = { version = "2", features = ["image-ico", "image-png"] }
# File dialogs via xdg-desktop-portal on Linux (the host's native dialog; the
# plugin's default is rfd's own GTK3 dialog). Windows is unaffected.
tauri-plugin-dialog = { version = "2.7.3", default-features = false, features = ["xdg-portal"] }
tauri-plugin-log = "2"
# The download link of a newer release, opened in the browser
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The web app API; rustls like BindSight, no native-tls
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
# Finding the blueprint lines in GBs of old logs
memchr = "2"
# OCR of the refinery terminal: ONNX Runtime (prebuilt, linked statically) for the PP-OCRv5 models,
# rustls for its build-time download like reqwest
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
# Decoding screenshots (tests, test frames); live frames come as raw pixels; encoding the debug
# view's frames (JPEG for the event, PNG for the export)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The debug view's frame in the event (already a dependency of others)
base64 = "0.21"
# The main and the debug window come back where they were (place, size, monitor)
tauri-plugin-window-state = "2"

# Screen capture for the refinery OCR (DXGI Desktop Duplication); the version Tauri already uses
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Updates of the installed app (NSIS setup from the own server, signed with the updater key); Windows only
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
