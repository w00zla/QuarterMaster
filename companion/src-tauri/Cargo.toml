[package]
name = "quartermaster-companion"
version = "2.2.0"
description = "Quartermaster Companion: reads Star Citizen's Game.log for the Quartermaster web app"
authors = ["w00zla"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name (a Windows issue,
# https://github.com/rust-lang/cargo/issues/8519); an rlib only: the bin and the examples link it (no mobile build)
name = "companion_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# image-ico/png: without them the bundle icons are not decoded and the windows get no icon (taskbar, Alt-Tab)
tauri = { version = "2", features = ["image-ico", "image-png"] }
# File dialogs via xdg-desktop-portal on Linux (the host's native dialog; the
# plugin's default is rfd's own GTK3 dialog). Windows is unaffected.
tauri-plugin-dialog = { version = "2.7.3", default-features = false, features = ["xdg-portal"] }
tauri-plugin-log = "2"
# The web app and the releases page, opened in the browser; the app's folders in the file manager
tauri-plugin-opener = "2"
# Download, signature check and install of an update; the checks go through update.rs (the desktop app's way)
tauri-plugin-updater = "2"
# Versions and tags of the update feed (update.rs)
semver = "1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The web app API; rustls like BindSight, no native-tls; gzip: the server gzips the companion's catalog
# (reqwest asks for it and unpacks it)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip"] }
# Finding the blueprint lines in GBs of old logs
memchr = "2"
# The OCR: sc-ohseearr's engine (ONNX Runtime, prebuilt and linked statically) and its model packages, compiled
# in; from its public repository by release tag (one tag for all its crates)
sc-ohseearr-core = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-model-paddle-det-tiny = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-model-sc-rec-latin = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-model-sc-warehouse-layout = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
# The readers: sc-ohseearr's Star Citizen layer (reader interface, the game's texts from global.ini) and its
# readers (the warehouse reader gets its layout detector, `sc-warehouse-layout`, from `ocr::warehouse_reader`)
sc-ohseearr-sc = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-warehouse = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-gear-inventory = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-refinery = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
sc-ohseearr-mining-hud = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
# The screen capture's platform independent parts (`Pixels`, the change gate `Gate`, the cursor's rest `Rest`); the
# capture itself per platform below
sc-ohseearr-capture = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
# Decoding screenshots (tests, test frames); live frames come as raw pixels; encoding the debug
# view's frames (JPEG for the event, PNG for the export)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# The debug view's frame in the event (already a dependency of others)
base64 = "0.21"
# The main and the debug window come back where they were (place, size, monitor)
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
# Screen capture of the game window (DXGI Desktop Duplication, the cursor)
sc-ohseearr-capture-win = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }
# The OCR on the GPU: ONNX Runtime's DirectML API (its Windows binaries have it anyway; the redistributable
# DirectML.dll comes next to the exe, see scripts/fetch-directml.mjs)
sc-ohseearr-core = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0", features = ["directml"] }
# The scan overlay's window (place, DPI, hotkeys); the version Tauri already uses
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Screen capture of the game window (ScreenCast portal and PipeWire, the cursor; builds against libpipewire's
# headers with clang)
sc-ohseearr-capture-linux = { git = "https://github.com/w00zla/sc-ohseearr", tag = "v0.3.0" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# `tauri dev` (UI changes through Vite's hot reload, no Rust build): the dependencies optimized once and
# kept (image, resizing, ONNX Runtime's wrapper: the OCR's hot paths), the app's own code quick to rebuild
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# A test build for the game (`build:fast`): release speed without LTO, incremental, many codegen units;
# minutes less per change. Releases stay on `release`
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
