# Production stack: Postgres, the Discord bot, the user web app and the admin web UI. Caddy runs on the host and
# terminates TLS (example: docs/Caddyfile.example). Values come from .env next to this file
# (see .env.example, section "Deployment").
#
#   scripts/deploy.sh                                        # first start and every update
#   docker compose run --rm bot node src/bot/register.ts     # after command changes
name: sc-quartermaster

# DB roles (deploy/db-roles.sh): qm_owner runs the migrations, qm_app is bot, admin and ext, qm_web is
# the user web app.
# The passwords go into URLs unescaped: URL-safe characters only (e.g. openssl rand -hex 32)
x-db-url-owner: &db-url-owner postgres://qm_owner:${QM_OWNER_PASSWORD:?set QM_OWNER_PASSWORD in .env}@db:5432/quartermaster
x-db-url: &db-url postgres://qm_app:${QM_APP_PASSWORD:?set QM_APP_PASSWORD in .env}@db:5432/quartermaster
x-db-url-web: &db-url-web postgres://qm_web:${QM_WEB_PASSWORD:?set QM_WEB_PASSWORD in .env}@db:5432/quartermaster

# The default json-file driver never rotates
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

x-app: &app
  image: sc-quartermaster:latest
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging
  depends_on:
    db: { condition: service_healthy }

services:
  # No published port: reachable on the compose network only
  db:
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      # Superuser "postgres": init, roles, dumps; no application uses it
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: quartermaster
      # For deploy/db-roles.sh
      QM_OWNER_PASSWORD: ${QM_OWNER_PASSWORD:?set QM_OWNER_PASSWORD in .env}
      QM_APP_PASSWORD: ${QM_APP_PASSWORD:?set QM_APP_PASSWORD in .env}
      QM_WEB_PASSWORD: ${QM_WEB_PASSWORD:?set QM_WEB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs on a fresh volume only; deploy.sh runs it after every migration
      - ./deploy/db-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, quartermaster]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging

  # One-off, never started by "up": docker compose run --rm migrate
  migrate:
    <<: *app
    profiles: [tools]
    restart: "no"
    command: [node, src/db/migrate.ts]
    environment:
      DATABASE_URL: *db-url-owner

  # No port: the Discord gateway is an outgoing connection
  bot:
    <<: *app
    command: [node, src/bot/main.ts]
    environment:
      DATABASE_URL: *db-url
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN in .env}
      DISCORD_APP_ID: ${DISCORD_APP_ID:?set DISCORD_APP_ID in .env}
      # Link to the user web app in the bot's panels (empty: no link)
      WEBAPP_ORIGIN: ${WEBAPP_ORIGIN:-}
      # Item thumbnails: which exist (the web app's thumbs.json), where Discord fetches them (empty: WEBAPP_ORIGIN/thumbs)
      THUMBS_DIR: /thumbs
      THUMBS_URL: ${THUMBS_URL:-}
    volumes:
      - ./local/thumbs:/thumbs:ro

  # Pulls the third-party data (UEX) into schema ext every 15 minutes; no port
  ext:
    <<: *app
    command: [node, src/ext/main.ts]
    environment:
      DATABASE_URL: *db-url
      UEX_TOKEN: ${UEX_TOKEN:?set UEX_TOKEN in .env}

  admin:
    <<: *app
    command: [node, src/adminapp/main.ts]
    environment:
      DATABASE_URL: *db-url
      ADMINAPP_USER: ${ADMINAPP_USER:?set ADMINAPP_USER in .env}
      ADMINAPP_PASSWORD: ${ADMINAPP_PASSWORD:?set ADMINAPP_PASSWORD in .env}
      # All interfaces inside the container; on the host only loopback, for Caddy.
      # Never publish without 127.0.0.1: Docker's port rules bypass ufw/firewalld.
      ADMINAPP_HOST: 0.0.0.0
      ADMINAPP_PORT: "3000"
      # The item thumbnails: coverage on Status, the image in the catalog's detail panels
      THUMBS_DIR: /thumbs
    volumes:
      - ./local/thumbs:/thumbs:ro
    ports: ["127.0.0.1:3001:3000"]

  # The user web app (Discord login, the companion app's API); Caddy serves it on 443
  webapp:
    <<: *app
    command: [node, src/webapp/main.ts]
    environment:
      DATABASE_URL: *db-url-web
      DISCORD_APP_ID: ${DISCORD_APP_ID:?set DISCORD_APP_ID in .env}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?set DISCORD_CLIENT_SECRET in .env}
      # Where the browser sees the app (https://…); the OAuth2 redirect is this + /auth/callback
      WEBAPP_ORIGIN: ${WEBAPP_ORIGIN:?set WEBAPP_ORIGIN in .env}
      # Client IPs from Caddy's X-Forwarded-For
      WEBAPP_TRUST_PROXY: "1"
      WEBAPP_HOST: 0.0.0.0
      WEBAPP_PORT: "3000"
      COMPANION_DIR: /companion
      THUMBS_DIR: /thumbs
    volumes:
      # The companion app release (companion.json + files), copied there by hand; local/ is gitignored
      - ./local/companion:/companion:ro
      # The item thumbnails (s/, m/, l/ + thumbs.json), from scripts/push-thumbs.sh
      - ./local/thumbs:/thumbs:ro
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
